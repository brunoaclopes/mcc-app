server {
    listen 80;
    root /usr/share/nginx/html;
    autoindex off;
    gzip on;
    gzip_types application/json;
    charset utf-8;

    # the app re-checks the index on every refresh; recipes and photos change rarely
    location = /index.json { add_header Cache-Control "no-cache"; }
    location /recipes/ { add_header Cache-Control "max-age=3600"; }
    location /images/  { add_header Cache-Control "max-age=86400"; }
    location = / { return 200 "mcc recipe server\n"; default_type text/plain; }
}
