# Example: run the server next to your recipe repository clone. Copy .env.example to .env and fill it in, put
# the deploy key and known_hosts in ./ssh, then: docker compose up -d --build
services:
  mcc-server:
    build:
      context: .
      args:
        APP_UID: "${MCC_UID:-1000}"
        APP_GID: "${MCC_GID:-1000}"
    image: mcc-server:local
    restart: unless-stopped
    user: "${MCC_UID:-1000}:${MCC_GID:-1000}"
    env_file: .env
    environment:
      MCC_DATA_DIR: /data
      MCC_REPO_DIR: /data/repo
      MCC_SSH_KEY: /ssh/id_ed25519
      MCC_SSH_KNOWN_HOSTS: /ssh/known_hosts
    ports:
      - "8080:8080"   # bind to one address if the host has several, e.g. "<lan-ip>:8080:8080"
    volumes:
      - ./data:/data        # the recipe repository clone, transcript cache, temporary audio
      - ./ssh:/ssh:ro       # deploy key (id_ed25519) and known_hosts
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges=true"]
