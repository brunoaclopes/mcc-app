# Push a tag vX.Y.Z on master: builds both apps, signs them and publishes a GitHub Release with the APKs,
# their SHA-256 checksums and the phone app's certificate fingerprint. How to cut one: docs/RELEASING.md.
#   machine app: signed with the public AOSP platform test key (signing/), which the firmware trusts
#   phone app:   signed with the release key from the "release" environment's secrets
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    environment: release
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tag is on master
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/master || { echo "::error::tag $GITHUB_REF_NAME is not on master"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true
      - name: Android SDK packages
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.2" "build-tools;37.0.0" "ndk;26.3.11579264" > /dev/null
      - name: Release key
        env:
          KEYSTORE_BASE64: ${{ secrets.MCC_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::the release key is not set up (docs/RELEASING.md); refusing to publish a debug-signed phone app"; exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "MCC_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Tests and release builds
        env:
          MCC_KEYSTORE_PASSWORD: ${{ secrets.MCC_KEYSTORE_PASSWORD }}
          MCC_KEY_ALIAS: ${{ secrets.MCC_KEY_ALIAS }}
          MCC_KEY_PASSWORD: ${{ secrets.MCC_KEY_PASSWORD }}
        run: ./gradlew --no-daemon :link:test :machine:test :recipe:test :common:testDebugUnitTest :app:assembleRelease :phone:assembleRelease
      - name: Collect, verify and checksum
        run: |
          rm -f "$RUNNER_TEMP/release.jks"
          ver() { sed -n 's/.*versionName = "\(.*\)".*/\1/p' "$1/build.gradle.kts"; }
          MACHINE="mcc-machine-$(ver app).apk"; PHONE="mcc-phone-$(ver phone).apk"
          mkdir dist
          cp app/build/outputs/apk/release/app-release.apk "dist/$MACHINE"
          cp phone/build/outputs/apk/release/phone-release.apk "dist/$PHONE"
          SIGNER="$ANDROID_HOME/build-tools/37.0.0/apksigner"
          fp() { "$SIGNER" verify --print-certs "$1" | sed -n 's/.*[Ss]igner.*certificate SHA-256 digest: //p' | head -1; }
          MACHINE_FP=$(fp "dist/$MACHINE"); PHONE_FP=$(fp "dist/$PHONE")
          # the phone app must not go out with the public test key or a debug key
          if [ -z "$PHONE_FP" ] || [ "$PHONE_FP" = "$MACHINE_FP" ]; then
            echo "::error::phone app is not signed with the release key"; exit 1
          fi
          if "$SIGNER" verify --print-certs "dist/$PHONE" | grep -q "CN=Android Debug"; then
            echo "::error::phone app is debug-signed"; exit 1
          fi
          (cd dist && sha256sum -- ./*.apk | sed 's| \./| |' > SHA256SUMS.txt)
          {
            echo "## Downloads"
            echo
            echo "| File | For | Signing certificate (SHA-256) |"
            echo "|---|---|---|"
            echo "| \`$MACHINE\` | the machine's tablet, installed with adb ([docs/SETUP.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/SETUP.md)) | \`$MACHINE_FP\` (public AOSP test key) |"
            echo "| \`$PHONE\` | Android phones, Android 10 or newer ([docs/PHONE.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/PHONE.md)) | \`$PHONE_FP\` |"
            echo
            echo "Check a download with \`sha256sum -c SHA256SUMS.txt\`, and the phone app's certificate with \`apksigner verify --print-certs\`."
            echo "Server images: \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mcc-server:${GITHUB_REF_NAME#v}\` and \`ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/mcc-recipe-server:${GITHUB_REF_NAME#v}\` ([docs/SERVER-SETUP.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/SERVER-SETUP.md))."
            echo
          } > notes.md
          cat notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --notes-file notes.md --generate-notes --verify-tag
